# =============================================================================
# docker-compose.prod.yml — Configuración para entorno de producción
# =============================================================================
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Diferencias con desarrollo:
#   - Sin hot-reload (sin volúmenes de código montados)
#   - API usa gunicorn + uvicorn workers (sin --reload)
#   - Frontend compilado con next build && next start
#   - Contraseñas deben venir de variables de entorno, no valores por defecto
#   - Sin healthcheck expuesto en API (se maneja externamente)
# =============================================================================

services:
  # =============================================================================
  # PostgreSQL 16 — Base de datos (producción)
  # =============================================================================
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es requerido}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es requerido}
      POSTGRES_DB: ${POSTGRES_DB:-tienda_mvp}
    # En producción, no exponer el puerto al host
    ports: !reset []
    # Usar un volumen con nombre específico para producción
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # =============================================================================
  # FastAPI — Backend API (producción)
  # =============================================================================
  api:
    build:
      dockerfile: Dockerfile.prod
    # Sin volúmenes de código (no hot-reload)
    volumes: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es requerido}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:?DATABASE_URL_SYNC es requerido}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es requerido}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS es requerido}
    # Healthcheck de producción (más conservador)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # Next.js — Frontend Web (producción)
  # =============================================================================
  web:
    build:
      dockerfile: Dockerfile.prod
    # Sin volúmenes de código (no hot-reload)
    volumes: !reset []
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL es requerido}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    # Sin healthcheck (Next.js no expone endpoint de salud por defecto)
    healthcheck: !reset []

# =============================================================================
# Volúmenes para producción
# =============================================================================
volumes:
  postgres_data_prod:
    name: tienda_mvp_postgres_data_prod
