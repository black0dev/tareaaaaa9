services:
  # =============================================================================
  # PostgreSQL 16 — Base de datos
  # =============================================================================
  db:
    image: postgres:16-alpine
    container_name: tienda_mvp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tienda_mvp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tienda_mvp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =============================================================================
  # FastAPI — Backend API
  # =============================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tienda_mvp_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/tienda_mvp}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://postgres:postgres@db:5432/tienda_mvp}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: montar código fuente para desarrollo
      - ./api/app:/app/app:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =============================================================================
  # Next.js — Frontend Web
  # =============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tienda_mvp_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://your-project.supabase.co}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-your-anon-key}
    ports:
      - "3000:3000"
    volumes:
      # Hot-reload: montar código fuente para desarrollo
      - ./web/src:/app/src:ro
      - ./web/public:/app/public:ro
    networks:
      - app-network

# =============================================================================
# Redes
# =============================================================================
networks:
  app-network:
    driver: bridge
    name: tienda_mvp_network

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  postgres_data:
    name: tienda_mvp_postgres_data
